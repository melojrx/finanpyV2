name: Validate and publish FinanPy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: finanpy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: core.settings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test --verbosity 1

      - name: Check production settings
        env:
          DJANGO_SETTINGS_MODULE: core.settings_production
          SECRET_KEY: ci-only-finanpy-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          POSTGRES_PASSWORD: ci-only
          ALLOWED_HOSTS: finanpy.com.br,www.finanpy.com.br
          CSRF_TRUSTED_ORIGINS: https://finanpy.com.br,https://www.finanpy.com.br
        run: python manage.py check --deploy

  publish:
    name: Publish immutable image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/melojrx/finanpyv2
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Record image digest
        run: |
          {
            echo '### FinanPy image'
            echo '```text'
            echo 'ghcr.io/melojrx/finanpyv2@${{ steps.image.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
