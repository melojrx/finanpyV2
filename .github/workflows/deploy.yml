name: Validate and publish FinanPy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: finanpy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: core.settings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: theme/static_src/package-lock.json

      - name: Build frontend assets
        working-directory: theme/static_src
        run: npm ci --no-audit --no-fund && npm run build

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare runtime directories
        run: mkdir -p logs

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test --verbosity 1

      - name: Check production settings
        env:
          DJANGO_SETTINGS_MODULE: core.settings_production
          SECRET_KEY: ci-only-finanpy-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          POSTGRES_PASSWORD: ci-only
          ALLOWED_HOSTS: finanpy.com.br,www.finanpy.com.br
          CSRF_TRUSTED_ORIGINS: https://finanpy.com.br,https://www.finanpy.com.br
        run: python manage.py check --deploy

  publish:
    name: Publish immutable image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/melojrx/finanpyv2
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Record image digest
        run: |
          {
            echo '### FinanPy image'
            echo '```text'
            echo 'ghcr.io/melojrx/finanpyv2@${{ steps.image.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Homelab
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab-finanpy-deploy]
    timeout-minutes: 15
    concurrency:
      group: deploy-finanpy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@v4

      - name: Promote immutable image
        run: |
          sudo /usr/local/sbin/deploy-finanpy-release \
            "$GITHUB_WORKSPACE" \
            "ghcr.io/melojrx/finanpyv2@${{ needs.publish.outputs.image }}"

      - name: Record release
        run: |
          {
            printf '%s\n' '### Homelab deployment'
            printf '%s\n' "- Commit: $GITHUB_SHA"
            printf '%s\n' "- Image: ghcr.io/melojrx/finanpyv2@${{ needs.publish.outputs.image }}"
            printf '%s\n' '- Controller: deploy-finanpy-release'
          } >> "$GITHUB_STEP_SUMMARY"
