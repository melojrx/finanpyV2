version: "3.8"

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.1
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/finanpy_cloudflared_tunnel_token
    secrets:
      - finanpy_cloudflared_tunnel_token
    networks:
      - edge
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == homelab

networks:
  edge:
    external: true

secrets:
  finanpy_cloudflared_tunnel_token:
    external: true
